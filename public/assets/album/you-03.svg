<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <!-- 👉 这是占位图：请在此处换成你自己的纪念照片（也可以直接在 src/config/story.js 中改路径）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dfd1"/>
      <stop offset="1" stop-color="#f8eee1"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".68"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#3d3035" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d3035" stop-opacity=".2"/>
    </radialGradient>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="3" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#light)"/>
  <g filter="url(#wc)">
    
  <circle cx="280" cy="260" r="140" fill="#f7e5cf" opacity=".6" filter="url(#blur6)"/>
  <path d="M80 900 C 160 780 220 700 360 640" fill="none" stroke="#9f856a" stroke-width="5" opacity=".3" stroke-linecap="round"/>
  <path d="M240 760 C 300 700 360 700 420 728" fill="none" stroke="#9f856a" stroke-width="3" opacity=".2" stroke-linecap="round"/>
  <g>
    <path d="M360 640 C 430 594 504 616 526 676 C 460 714 394 703 360 640Z" fill="#cfaa86" opacity=".52"/>
    <path d="M313 690 C 356 636 428 634 465 672 C 420 718 352 728 313 690Z" fill="#d9b999" opacity=".45"/>
    <path d="M242 832 C 290 792 352 794 386 828 C 344 862 284 864 242 832Z" fill="#c8a785" opacity=".38"/>
    <path d="M478 586 C 518 550 575 558 595 596 C 560 626 510 620 478 586Z" fill="#d8b59a" opacity=".36"/>
  </g>
  <g fill="none" stroke="#a88b70" stroke-width="1.4" opacity=".24">
    <path d="M198 310 C 300 392 340 470 390 560"/>
    <path d="M198 310 C 260 250 330 240 396 270"/>
  </g>
  <g transform="translate(500 760) rotate(6)">
    <rect width="220" height="148" rx="4" fill="#f8efdb" stroke="#c9b28f" stroke-width="1.2"/>
    <path d="M0 0 L110 82 L220 0" fill="#f0e0c4" stroke="#ccb590" stroke-width="1.2"/>
    <path d="M0 148 L88 76 M220 148 L132 76" stroke="#d3be9b" stroke-width="1" opacity=".7"/>
    <circle cx="110" cy="85" r="15" fill="#d4a2a6" opacity=".7"/>
    <path d="M105 85 c2-5 9-5 10 0" fill="none" stroke="#fff3e7" stroke-width="1.4"/>
  </g>
  <g fill="#d7b89a" opacity=".36">
    <circle cx="150" cy="905" r="3"/><circle cx="720" cy="820" r="2.5"/><circle cx="790" cy="700" r="1.8"/>
    <circle cx="650" cy="610" r="2"/><circle cx="100" cy="560" r="1.7"/>
  </g>
  <path d="M70 980 C 260 946 470 960 680 930 C 770 918 830 924 880 916" fill="none" stroke="#b39a80" stroke-width="1.4" opacity=".2"/>

  </g>
  <rect width="900" height="1200" fill="url(#vignette)"/>
  <g font-family="'YouYuan','PingFang SC','Microsoft YaHei',sans-serif" fill="#4f4145">
    <text x="70" y="1055" font-size="21" letter-spacing="5" opacity=".55">YOUR PHOTO · AUTUMN</text>
    <text x="70" y="1102" font-size="31" letter-spacing="4" opacity=".72">你的照片 · 第三页</text>
    <text x="70" y="1140" font-size="15" letter-spacing="2" opacity=".34">03 · YOU · 请替换为你的照片</text>
    <path d="M70 1068h110" stroke="#4f4145" stroke-width="1" opacity=".18"/>
  </g>
  <rect width="900" height="1200" filter="url(#grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>