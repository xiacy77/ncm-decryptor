<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <!-- 👉 这是占位图：请在此处换成你自己的纪念照片（也可以直接在 src/config/story.js 中改路径）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dfe1"/>
      <stop offset="1" stop-color="#f6ebde"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".68"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#3d3035" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d3035" stop-opacity=".2"/>
    </radialGradient>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="3" seed="29" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#light)"/>
  <g filter="url(#wc)">
    
  <path d="M260 760 L260 350 C260 170 380 80 560 80 C740 80 860 170 860 350 L860 760 Z" fill="#d9d9e4" opacity=".42" filter="url(#soft)"/>
  <path d="M285 740 L285 360 C285 200 390 115 560 115 C730 115 835 200 835 360 L835 740 Z" fill="#76809a" opacity=".44"/>
  <circle cx="655" cy="290" r="75" fill="#f7ead1" opacity=".8" filter="url(#blur6)"/>
  <g fill="#f8eedb">
    <circle cx="380" cy="235" r="2.2" opacity=".7"/><circle cx="465" cy="315" r="1.8" opacity=".6"/>
    <circle cx="730" cy="400" r="2.1" opacity=".5"/><circle cx="350" cy="420" r="1.4" opacity=".4"/>
  </g>
  <path d="M285 690 C 390 604 470 580 560 586 C 680 594 770 610 835 666 L835 740 L285 740Z" fill="#8d97a5" opacity=".3"/>
  <path d="M210 820 C 180 660 290 570 360 540 C 390 640 382 740 340 825Z" fill="#eee2d8" opacity=".64"/>
  <path d="M850 825 C 900 650 820 560 740 528 C 698 640 702 750 740 825Z" fill="#e6d9d5" opacity=".55"/>
  <g transform="translate(160 810)" opacity=".48">
    <path d="M80 250 L 85 90" stroke="#7e8b76" stroke-width="4" fill="none"/>
    <path d="M84 176 C 30 160 20 110 22 85 C 72 94 90 128 84 176Z" fill="#a3b09a"/>
    <path d="M84 146 C 132 128 144 84 139 56 C 96 68 78 102 84 146Z" fill="#bac4b1"/>
    <path d="M84 216 C 48 202 30 176 28 150 C 68 154 88 182 84 216Z" fill="#aebda8"/>
  </g>
  <path d="M265 986 C 430 954 620 973 842 938" fill="none" stroke="#9b877f" stroke-width="2" opacity=".2"/>
  <ellipse cx="530" cy="1020" rx="320" ry="48" fill="#d8cbc0" opacity=".25" filter="url(#blur6)"/>

  </g>
  <rect width="900" height="1200" fill="url(#vignette)"/>
  <g font-family="'YouYuan','PingFang SC','Microsoft YaHei',sans-serif" fill="#4f4145">
    <text x="70" y="1055" font-size="21" letter-spacing="5" opacity=".55">YOUR PHOTO · SUMMER</text>
    <text x="70" y="1102" font-size="31" letter-spacing="4" opacity=".72">你的照片 · 第二页</text>
    <text x="70" y="1140" font-size="15" letter-spacing="2" opacity=".34">02 · YOU · 请替换为你的照片</text>
    <path d="M70 1068h110" stroke="#4f4145" stroke-width="1" opacity=".18"/>
  </g>
  <rect width="900" height="1200" filter="url(#grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>